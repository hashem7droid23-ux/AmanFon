name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17 (Zulu JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Debug Keystore
        run: |
          echo "Verifying debug.keystore..."
          if [ -f "debug.keystore.base64" ] && [ ! -s "debug.keystore" ]; then
            echo "Attempting to restore debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating valid debug.keystore using keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore
          if [ -d "android" ]; then
            cp -f debug.keystore android/debug.keystore || true
          fi

      - name: Configure Android Properties & MultiDex
        run: |
          if [ -f "gradle.properties" ]; then
            grep -qxF "android.useAndroidX=true" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
            grep -qxF "android.enableJetifier=true" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties
          fi

      - name: Install Dependencies & Prepare Assets
        run: |
          if [ -f "package.json" ]; then
            echo "package.json found. Installing dependencies..."
            npm install --legacy-peer-deps
            if grep -q '"build":' package.json; then
              echo "Running web build..."
              npm run build
            fi
            if [ -d "android" ]; then
              echo "Syncing Capacitor android platform..."
              npx cap sync android
            elif command -v npx &> /dev/null; then
              echo "Initializing Capacitor android platform..."
              npx cap add android || true
              npx cap sync android || true
            fi
          else
            echo "Native Android project detected. Proceeding with Gradle."
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          # Guarantee debug.keystore is present before task runs
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -d "android" ] && [ -f "./android/gradlew" ]; then
            echo "Executing assembleDebug in ./android..."
            cd android
            [ ! -f "debug.keystore" ] && cp -f ../debug.keystore ./ || true
            ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true
            cd ..
          elif [ -f "./gradlew" ]; then
            echo "Executing assembleDebug in root project..."
            ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true
          else
            echo "Generating wrapper and building assembleDebug..."
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true
          fi

      - name: Prepare Clean APK for Export
        run: |
          mkdir -p dist
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp -f "app/build/outputs/apk/debug/app-debug.apk" "dist/AmanFon.apk"
            echo "Found APK at app/build/outputs/apk/debug/app-debug.apk -> copied to dist/AmanFon.apk"
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp -f "android/app/build/outputs/apk/debug/app-debug.apk" "dist/AmanFon.apk"
            echo "Found APK at android/app/build/outputs/apk/debug/app-debug.apk -> copied to dist/AmanFon.apk"
          else
            echo "Searching for any generated apk..."
            find . -name "*.apk" -type f -exec cp -f {} dist/AmanFon.apk \;
          fi
          ls -lh dist/AmanFon.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmanFon-APK
          path: dist/AmanFon.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0-debug"
          echo "Publishing direct AmanFon.apk to GitHub Releases for one-click download..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh release delete "$TAG" --yes || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          gh release create "$TAG" "dist/AmanFon.apk" \
            --title "AmanFon Debug APK (Direct Download)" \
            --notes "📥 **تحميل مباشر للـ APK بدون فك ضغط**: قم بالنقر على AmanFon.apk أدناه لتحميله مباشرة وتثبيته على هاتفك فوراً." \
            --prerelease || echo "GitHub release creation skipped or permissions not granted."

