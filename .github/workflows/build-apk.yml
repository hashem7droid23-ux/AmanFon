name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17 (Zulu JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Restore Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Configure Android Properties & MultiDex
        run: |
          if [ -f "gradle.properties" ]; then
            grep -qxF "android.useAndroidX=true" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
            grep -qxF "android.enableJetifier=true" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties
          fi

      - name: Install Dependencies & Prepare Assets
        run: |
          if [ -f "package.json" ]; then
            echo "package.json found. Installing dependencies..."
            npm install --legacy-peer-deps
            if grep -q '"build":' package.json; then
              echo "Running web build..."
              npm run build
            fi
            if [ -d "android" ]; then
              echo "Syncing Capacitor android platform..."
              npx cap sync android
            elif command -v npx &> /dev/null; then
              echo "Initializing Capacitor android platform..."
              npx cap add android || true
              npx cap sync android || true
            fi
          else
            echo "Native Android project detected. Proceeding with Gradle."
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -d "android" ] && [ -f "./android/gradlew" ]; then
            echo "Executing assembleDebug in ./android..."
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace
            cd ..
          elif [ -f "./gradlew" ]; then
            echo "Executing assembleDebug in root project..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Generating wrapper and building assembleDebug..."
            gradle wrapper
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Align Output Path for Artifact Upload
        run: |
          mkdir -p android/app/build/outputs/apk/debug/
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp -f app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/app-debug.apk
            echo "Copied APK to android/app/build/outputs/apk/debug/app-debug.apk"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmanFon-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
