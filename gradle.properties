# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Single shared JVM budget under the 2 GiB cgroup limit: dex merging (D8) runs
# in-process in the daemon, so the daemon heap must be large enough for it,
# while C1-only compilation + small metaspace keep native usage low.
# MaxMetaspaceSize is a cap, not a reservation: 512m accommodates the Kotlin
# compiler in CI (--no-daemon) without raising peak RSS in 2 GiB sandboxes.
org.gradle.jvmargs=-XX:TieredStopAtLevel=1 -Xmx1400m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Djava.awt.headless=true
# Use C1-only compilation for Kotlin compile workers too.
kotlin.daemon.jvm.options=-XX:TieredStopAtLevel=1
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# Single-project build: no parallelism needed, and fewer concurrent workers keeps
# total memory (daemon + worker JVMs) under the 2 GiB cgroup limit.
org.gradle.parallel=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableJetifier=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# One worker at a time: each D8/dex worker is a separate JVM (~512m).
org.gradle.workers.max=1
# Run the Kotlin compiler inside the Gradle daemon process (no separate Kotlin daemon).
kotlin.compiler.execution.strategy=in-process
# Allow the google-services plugin to work even if the google-services.json is not present.
googleServices.missing.passthrough=true
